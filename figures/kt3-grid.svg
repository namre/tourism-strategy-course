<rect x="180" y="314" width="78" height="64" rx="8" fill="none" stroke="#62736d" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="219" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#62736d" text-anchor="middle"><tspan x="219" dy="0">нет замера</tspan></text>
