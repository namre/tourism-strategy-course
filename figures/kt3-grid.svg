<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 642" role="img" aria-labelledby="t d">
<title id="t">12 замеров цены</title>
<desc id="d">Сетка замеров: три объекта, две даты заезда (пик и межсезонье), два канала (сайт и площадка бронирования); в ячейке итоговая цена и значок условий отмены; в примерах 5 900 рублей без возврата и 6 300 рублей с бесплатной отменой.</desc>
<defs>
<pattern id="pDots" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff"/><circle cx="3" cy="3" r="1.4" fill="#163e37"/></pattern>
<pattern id="pDiag" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#163e37" stroke-width="2.2"/></pattern>
</defs>
<text x="12" y="24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#62736d" font-weight="700" text-anchor="start"><tspan x="12" dy="0">3 объекта × 2 даты × 2 канала = 12 замеров</tspan></text>
<rect x="12" y="40" width="160" height="28" rx="7" fill="#163e37" stroke="#163e37" stroke-width="1.5"/>
<text x="92" y="59" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#fff" font-weight="700" text-anchor="middle"><tspan x="92" dy="0">Пик</tspan></text>
<rect x="180" y="40" width="160" height="28" rx="7" fill="#fff" stroke="#163e37" stroke-width="1.5"/>
