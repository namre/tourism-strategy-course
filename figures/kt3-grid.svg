<text x="51" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#62736d" font-weight="700" text-anchor="middle"><tspan x="51" dy="0">сайт</tspan></text>
<text x="133" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#62736d" font-weight="700" text-anchor="middle"><tspan x="133" dy="0">площадка</tspan></text>
<text x="219" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#62736d" font-weight="700" text-anchor="middle"><tspan x="219" dy="0">сайт</tspan></text>
<text x="301" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="#62736d" font-weight="700" text-anchor="middle"><tspan x="301" dy="0">площадка</tspan></text>
<text x="12" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#163e37" font-weight="700" text-anchor="start"><tspan x="12" dy="0">Объект 1</tspan></text>
