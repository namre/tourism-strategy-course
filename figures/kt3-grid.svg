<text x="64" y="524" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#163e37" font-weight="700" text-anchor="start"><tspan x="64" dy="0">5 900 ₽ без возврата и 6 300 ₽ с</tspan><tspan x="64" dy="20">бесплатной отменой —</tspan><tspan x="64" dy="20">несравнимы: сравнивайте</tspan><tspan x="64" dy="20">итоговую цену вместе с</tspan><tspan x="64" dy="20">условиями</tspan></text>
