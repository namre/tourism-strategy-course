<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 700" role="img" aria-labelledby="m2l2-capacity-t m2l2-capacity-d">
<title id="m2l2-capacity-t">Полоса мощности</title>
<desc id="m2l2-capacity-d">Две полосы мощности: пик (10 дней, 400 номеро-ночей) и остальные 20 дней (800); под каждой показано, сколько ночей хочет занять каждый пакет и сколько вытесняет базовый спрос.</desc>
