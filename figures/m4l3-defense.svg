<text x="196" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" fill="#163e37" font-weight="700" text-anchor="start"><tspan x="196" dy="0">ниже 1 872 ₽</tspan></text>
