<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 534" role="img" aria-labelledby="t d">
<title id="t">Карта защиты</title>
<desc id="d">В центре решение: прямой пакет, 705 640 рублей. Четыре луча — условия пересмотра: спрос пика ниже 310 ночей ведёт к агрегатору; ниже 240 ночей — к корпоративному пакету; подтверждённый перенос 140 ночей из пика — к корпоративному, 959 400 рублей; маржа вытесненной ночи ниже 1 872 рублей — пересчитать.</desc>
