<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1182" role="img" aria-labelledby="t d">
<title id="t">«Маяк» → ваш объект</title>
<desc id="d">Четыре карточки объектов: отель, экскурсия на автобусе, экотропа, база с лодками; для каждого единица мощности, пик, посредник с комиссией и тот, кого вытесняет дешёвая продажа в пик; внизу пример экотропы.</desc>
<defs>
